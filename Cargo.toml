[package]
name = "coverbuilder"
version = "0.1.0"
edition = "2021"
authors = ["Lily Persilly"]
description = "A Murakami-inspired geometric book cover design studio built in Rust & egui."
license = "MIT"
repository = "https://github.com/YOUR_USERNAME/coverbuilder"

[dependencies]
eframe = "0.37"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/coverbuilder", dest = "/usr/bin/coverbuilder", mode = "755" }
]
[package.metadata.deb]
maintainer = "Lily Persilly"
section = "graphics"
assets = [
    ["target/release/coverbuilder", "usr/bin/", "755"],
    ["coverbuilder.desktop", "usr/share/applications/", "644"]
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/coverbuilder", dest = "/usr/bin/coverbuilder", mode = "755" },
    { source = "coverbuilder.desktop", dest = "/usr/share/applications/coverbuilder.desktop", mode = "644" }
]
